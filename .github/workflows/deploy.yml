name: Deploy Server Stacks

on:
  push:
    branches:
      - main
    paths:
      - 'immich/**'
      - 'paperless/**'
      - 'ollama/**'
      - 'jellyfin/**'
      - 'media/**'
      - 'downloads/**'
      - 'tuner/**'
      - 'utilities/**' 
      - 'tailscale/**'
      - 'nextcloud/**'

jobs:
  deploy:
    runs-on: self-hosted  # 🌟 Instructs GitHub to use your local Docker server runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 1. Fetch all history so git diff can accurately compare commits

      - name: Deploy Changed Stacks
        run: |
          # 2. Get a list of all unique top-level directories that changed in this push
          # We use github.event.before to compare against the previous repository state safely
          CHANGED_STACKS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d '/' -f1 | sort -u)
          
          echo "Detected changes in the following stacks:"
          echo "$CHANGED_STACKS"
          
          # 3. Loop through each detected folder and deploy it if a compose file exists
          for stack in $CHANGED_STACKS; do
            if [ -d "${{ github.workspace }}/$stack" ] && [ -f "${{ github.workspace }}/$stack/docker-compose.yml" ] || [ -f "${{ github.workspace }}/$stack/compose.yaml" ]; then
              echo "--------------------------------------------------------"
              echo "🚀 Deploying stack: $stack"
              echo "--------------------------------------------------------"
              
              cd ${{ github.workspace }}/$stack
              docker compose pull
              docker compose up -d --remove-orphans
            else
              echo "⏩ Skipping '$stack' (Not a directory or no docker-compose file found)"
            fi
          done
