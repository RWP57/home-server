name: Deploy Server Stacks

on:
  push:
    branches:
      - main
    paths:
      - 'immich/**'
      - 'paperless/**'
      - 'ollama/**'
      - 'jellyfin/**'

jobs:
  deploy:
    runs-on: ubuntu-latest  # 🌟 FIX 1: Changed 'runs-rate' to 'runs-on'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Determine changed stack
        id: check_changes
        run: |
          CHANGED_DIR=$(git diff --name-only HEAD~1 | head -n 1 | cut -d '/' -f1)
          echo "stack=$CHANGED_DIR" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:  # 🌟 FIX 2: Fixed the indentation blocks directly below this line
          host: ${{ vars.SERVER_HOST }}       # 🌟 FIX 3: Changed 'variables' to 'vars'
          username: ${{ vars.SERVER_USER }}   # 🌟 FIX 3: Changed 'variables' to 'vars'
          key: ${{ secrets.SERVER_SSH_KEY }}     
          port: ${{ vars.SERVER_PORT }}       # 🌟 FIX 3: Changed 'variables' to 'vars'
          script: |
            cd /home/${{ vars.SERVER_USER }}/homeserver/${{ steps.check_changes.outputs.stack }}
            git pull
            docker compose pull
            docker config
           # docker compose up -d --remove-orphans


