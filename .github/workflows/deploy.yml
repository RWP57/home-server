name: Deploy Server Stacks

on:
  push:
    branches:
      - main
    paths:
      - 'immich/**'
      - 'paperless/**'
      - 'ollama/**'
      - 'jellyfin/**'
      - 'media/**'
      - 'downloads/**'
      - 'tuner/**'
      - 'utilities/**' 
      - 'tailscale/**'

jobs:
  deploy:
    runs-on: self-hosted  # 🌟 Instructs GitHub to use your local Docker server runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 
      - name: Determine changed stack
        id: check_changes
        run: |
          CHANGED_DIR=$(git diff --name-only HEAD~1 | head -n 1 | cut -d '/' -f1)
          echo "stack=$CHANGED_DIR" >> $GITHUB_OUTPUT
      - name: Deploy Local Stack
        run: |
          # 1. Move to where your runner checked out the repository files
          # 2. Pull the images and update the exact container stack locally
          cd ${{ github.workspace }}/${{ steps.check_changes.outputs.stack }}
          pwd
          ls
          docker compose pull
          #docker compose up -d --remove-orphans
          docker compose config
