services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: server1
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ACCEPT_DNS=false
    volumes:
      - /home/robbo/docker/tailscale/state:/var/lib/tailscale
    restart: unless-stopped
