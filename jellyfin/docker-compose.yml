services:
#
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - DOTNET_SYSTEM_NET_DISABLEIPV6=1
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
      - JELLYFIN_EnableDlna=false
    command: sh -c "sleep 15 && /jellyfin/jellyfin"
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
#      - /home/robbo/docker/jellyfin/config:/config
#      - /home/robbo/docker/jellyfin/cache:/cache
      -  /mnt/media/home-server/jellyfin/jellyfin/config:/config
      -  /mnt/media/home-server/jellyfin/jellyfin/cache:/cache
      - /media:/media
    networks:
      - tv-network
      - default
      - proxy-tier
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped


  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    volumes:
    #  - /home/robbo/docker/sonarr/config:/config
      - /mnt/media/home-server/jellyfin/sonarr/config:/config
      - /media/tv:/tv
      - /media/downloads:/downloads
    depends_on:
      sabnzbd:
        condition: service_healthy
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    volumes:
    #  - /home/robbo/docker/radarr/config:/config
      - /mnt/media/home-server/jellyfin/radarr/config:/config
      - /media/Xmovies:/movies
      - /media/downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped

#  jellyseerr:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
#    image: fallenbagel/jellyseerr:latest
#    container_name: jellyseerr
    container_name: seerr
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Chicago
    ports:
      - "5055:5055"
    volumes:
   #   - /home/robbo/docker/jellyseerr/config:/app/config
      - /mnt/media/home-server/jellyfin/jellyseerr/config:/app/config
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  sabnzbd:
    image: linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api?mode=version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - /mnt/media/home-server/jellyfin/sabnzbd/config:/config
      - /media/downloads:/downloads
    ports:
      - "8080:8080"
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "9696:9696"
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    volumes:
  #    - /home/robbo/docker/prowlarr/config:/config
      - /mnt/media/home-server/jellyfin/prowlarr/config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    volumes:
#      - /home/robbo/docker/qbittorrent/appdata:/config
      - /mnt/media/home-server/jellyfin/qbittorrent/appdata:/config
      - /media/Xmovies:/movies
      - /media/downloads:/downloads
    ports:
      - "8081:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
  #    - /home/robbo/docker/nzbget/config:/config
      - /mnt/media/home-server/jellyfin/nzbget/config:/config
      - /media/Xmovies:/movies
      - /media/downloads:/downloads
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    ports:
      - "6789:6789"
    restart: unless-stopped


  fastchannels:
    image: ghcr.io/kineticman/fastchannels:latest
    container_name: fastchannels
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    ports:
      - "5523:5523"  # Keeps your diagnostic status page open
    volumes:
      - /media/tuner/fastchannels_data:/data
    networks:
      - tv-network
      
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
#      - /home/robbo/docker/deluge/config:/config
      - /mnt/media/home-server/jellyfin/deluge/config:/config
      - /media/downloads:/downloads
    networks:          # 🌟 ADD THIS
      - tv-network     # 🌟 ADD THIS
    ports:
      - "8112:8112"
      - "58846:58846"
      - "58846:58846/udp"
      - "6882:6881"
      - "6882:6881/udp"
    restart: unless-stopped

  hls-proxy:
    image: riftbit/hls-proxy:latest
    container_name: hls-proxy
    restart: unless-stopped
    ports:
      - "34300:34300"  # Native UI port for riftbit image
    volumes:
      - /media/tuner/hls_config:/opt/hlsp/config
    networks:
      - tv-network

networks:
  tv-network:
    driver: bridge
  proxy-tier:     # 🌟 FIX: Removed the dashes and added colons
    external: true  # Tells Docker this network already exists on your server

