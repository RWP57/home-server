services:
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /home/robbo/docker/grocy/config:/config
    ports:
      - "9283:80"
    restart: unless-stopped

  sqlite-editor:
    image: tomdesinto/sqliteweb:latest
    container_name: sqlite-editor
    ports:
      - "7979:8080"
    volumes:
      # Corrected to point to your live Grocy database
      - /home/robbo/docker/grocy/config/data/grocy.db:/db/grocy.db
    command:
      - sqlite_web
      - /db/grocy.db
      - --host=0.0.0.0
